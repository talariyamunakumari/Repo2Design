services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      retries: 10

  ollama:
    image: ollama/ollama
    volumes: [ollama_data:/root/.ollama]
    # Uncomment for NVIDIA GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{driver: nvidia, count: all, capabilities: [gpu]}]

  ollama-init:            # one-time model download, then exits
    image: ollama/ollama
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "sleep 5 && ollama pull qwen2.5-coder:7b && ollama pull nomic-embed-text"]
    restart: "no"

  api:
    build: .
    ports: ["8000:8000"]
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: qwen2.5-coder:7b
      DATABASE_URL: postgresql+psycopg2://app:app@db:5432/app
    volumes: ["./data:/srv/data"]
    depends_on:
      db: {condition: service_healthy}
      ollama: {condition: service_started}

volumes:
  pg_data:
  ollama_data:
